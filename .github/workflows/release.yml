name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - run: npm ci
        env:
          WORDPICK_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: v__VERSION__
          releaseName: 'WordPick v__VERSION__'
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: true
      - name: Upload npm-compatible binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TARGET" = 'win32-x64' ]; then
            cp src-tauri/target/release/wordpick.exe wordpick-win32-x64.exe
            gh release upload "v$version" wordpick-win32-x64.exe --clobber
          else
            cp src-tauri/target/release/wordpick wordpick-darwin-arm64
            gh release upload "v$version" wordpick-darwin-arm64 --clobber
          fi

  publish-npm:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          WORDPICK_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
